name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Python syntax
        run: python -m compileall -q server.py shared.py routers tests

      - name: Python lint
        # Start with semantic linting; the repository has pre-existing style debt.
        run: python -m ruff check --select F server.py shared.py routers tests

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in static/js/*.js; do
            node --check "$file"
          done

      - name: Tests
        run: python -m pytest -q
